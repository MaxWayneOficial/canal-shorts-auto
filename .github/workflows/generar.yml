name: Generador automatico de YouTube Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar FFmpeg y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow edge-tts

      - name: Verificar configuración
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python --version
          ffmpeg -version | head -n 1
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: falta el secreto GEMINI_API_KEY en GitHub."
            exit 1
          fi
          echo "La clave GEMINI_API_KEY está configurada."

      - name: Generar video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python -u -X faulthandler main.py

      - name: Guardar Short generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-generado
          path: output/
          retention-days: 7
          if-no-files-found: ignore
